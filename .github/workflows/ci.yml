name: CI Check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions.md'
      - 'LICENSE'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'
      - 'codepackr_social_media_promotions.csv'
      - 'scripts/generate-tool-docs.py'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions.md'
      - 'LICENSE'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'
      - 'codepackr_social_media_promotions.csv'
      - 'scripts/generate-tool-docs.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck & Lint
        run: npm run lint

      - name: Test Production Build
        run: npm run build
