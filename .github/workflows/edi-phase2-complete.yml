name: Complete EDI Phase 2

on:
  push:
    branches:
      - feat/edi-ux-phase2

permissions:
  contents: write

jobs:
  phase2:
    if: "!contains(github.event.head_commit.message, '[phase2-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/edi-ux-phase2
      - name: Apply Phase 2 integration
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/tools/EdiToolsView.tsx')
          s = p.read_text(encoding='utf-8')
          anchor = "import { popSmartPastePayload } from '../../lib/workspace';\n"
          imp = "import { EdiPhase2Inspector } from '../edi/EdiPhase2Inspector';\n"
          if imp not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          old = """        {activeTab === 'edi-message-gateway' && (\n          <EdiMessageGatewayView tool={tool} onBackToHome={onBackToHome} onSelectRelated={onSelectRelated} initialInput={input} />\n        )}"""
          new = """        {activeTab === 'edi-message-gateway' && (\n          <EdiPhase2UxBoundary\n            title=\"EDI Message Gateway\"\n            description=\"Guided inbound/outbound EDI gateway with progressive disclosure, Story Mode samples, and synchronized segment inspection.\"\n            defaultSampleId={selectedSampleId}\n            initialInput={input}\n            onSampleLoad={(payload, sampleId) => {\n              setSelectedSampleId(sampleId);\n              setInput(payload);\n            }}\n          >\n            <EdiMessageGatewayView\n              key={`phase2-gateway-${selectedSampleId}`}\n              tool={tool}\n              onBackToHome={onBackToHome}\n              onSelectRelated={onSelectRelated}\n              initialInput={input}\n            />\n          </EdiPhase2UxBoundary>\n        )}"""
          if old not in s: raise SystemExit('gateway anchor missing')
          s = s.replace(old, new, 1)
          marker = "      {/* 4. EDI VALIDATOR VIEW: Full Dashboard, Report & Live Editor */}"
          inspector = """      {/* Phase 2: synchronized raw ↔ visual tree inspector for every EDI tool */}\n      <EdiPhase2Inspector\n        input={input}\n        elementSeparator={elementSeparator}\n        segmentTerminator={segmentTerminator}\n        onLoadSample={loadTransactionSample}\n      />\n\n"""
          if 'Phase 2: synchronized raw ↔ visual tree inspector' not in s:
              if marker not in s: raise SystemExit('inspector marker missing')
              s = s.replace(marker, inspector + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Install and build
        run: npm install --ignore-scripts && npm run build
      - name: Commit completed Phase 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/tools/EdiToolsView.tsx
          git commit -m "feat(edi): complete Phase 2 UX integration [phase2-complete]" || exit 0
          git push origin HEAD:feat/edi-ux-phase2
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/edi-phase2-complete.yml
          git commit -m "chore(edi): remove one-time Phase 2 workflow [phase2-complete]" || exit 0
          git push origin HEAD:feat/edi-ux-phase2
