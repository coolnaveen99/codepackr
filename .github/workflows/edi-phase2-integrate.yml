name: EDI Phase 2 Integration

on:
  push:
    branches:
      - feat/edi-ux-phase2

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[phase2-bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/edi-ux-phase2

      - name: Integrate Phase 2 gateway UX
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/tools/EdiToolsView.tsx')
          text = path.read_text(encoding='utf-8')

          import_line = "import { EdiPhase2UxBoundary } from '../edi/EdiPhase2UxBoundary';\n"
          anchor = "import { EdiTutorialPanel } from '../edi/EdiTutorialPanel';\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Unable to find EDI import anchor')
              text = text.replace(anchor, anchor + import_line, 1)

          old = """        {activeTab === 'edi-message-gateway' && (\n          <EdiMessageGatewayView tool={tool} onBackToHome={onBackToHome} onSelectRelated={onSelectRelated} initialInput={input} />\n        )}"""
          new = """        {activeTab === 'edi-message-gateway' && (\n          <EdiPhase2UxBoundary\n            title=\"EDI Message Gateway\"\n            description=\"Guided inbound/outbound EDI gateway with progressive disclosure and Story Mode samples.\"\n            defaultSampleId={selectedSampleId}\n            initialInput={input}\n            onSampleLoad={(payload, sampleId) => {\n              setSelectedSampleId(sampleId);\n              setInput(payload);\n            }}\n          >\n            <EdiMessageGatewayView\n              key={`phase2-gateway-${selectedSampleId}`}\n              tool={tool}\n              onBackToHome={onBackToHome}\n              onSelectRelated={onSelectRelated}\n              initialInput={input}\n            />\n          </EdiPhase2UxBoundary>\n        )}"""
          if old not in text:
              raise SystemExit('Gateway JSX anchor not found; refusing unsafe edit')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck and build
        run: |
          npm run build

      - name: Commit Phase 2 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/tools/EdiToolsView.tsx .github/workflows/edi-phase2-integrate.yml
          git rm .github/workflows/edi-phase2-integrate.yml
          git commit -m "feat(edi): integrate Phase 2 gateway UX [phase2-bot]"
          git push origin HEAD:feat/edi-ux-phase2
