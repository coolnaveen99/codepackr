<div class="toast" id="_toast"></div>
<script>function toast(msg,type){var el=document.getElementById('_toast');el.textContent=msg;el.className='toast'+(type?' t-'+type:'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2400);}
function setStatus(msg,type){var el=document.getElementById('statusEl');if(!msg){el.style.display='none';return;}el.className='status-bar status-'+type;el.textContent=(type==='valid'?'✓ ':type==='invalid'?'✗ ':'ℹ ')+msg;el.style.display='flex';}
var _dir='json2csv';
function setDir(d,btn){
 _dir=d;
 document.querySelectorAll('#dirTab .tab').forEach(function(b){b.classList.remove('active');});
 btn.classList.add('active');
 document.getElementById('inLabel').textContent=d==='json2csv'?'JSON Input':'CSV Input';
 document.getElementById('outLabel').textContent=d==='json2csv'?'CSV Output':'JSON Output';
 document.getElementById('inp').placeholder=d==='json2csv'?'Paste JSON array of objects…':'Paste CSV data…';
 document.getElementById('out').textContent='';setStatus();
}
function escCsv(val,delim){
 var s=String(val===null||val===undefined?'':val);
 if(s.includes(delim)||s.includes('"')||s.includes('\n')){return'"'+s.replace(/"/g,'""')+'"';}
 return s;
}
function json2csv(arr,delim){
 if(!Array.isArray(arr)||!arr.length)throw new Error('JSON must be a non-empty array of objects');
 var keys=[];
 arr.forEach(function(row){Object.keys(row).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k);});});
 var lines=[keys.map(function(k){return escCsv(k,delim);}).join(delim)];
 arr.forEach(function(row){lines.push(keys.map(function(k){return escCsv(row[k],delim);}).join(delim));});
 return lines.join('\n');
}
function csv2json(text,delim){
 var lines=text.split('\n').filter(function(l){return l.trim();});
 if(lines.length<2)throw new Error('CSV must have at least a header row and one data row');
 function parseLine(line){
 var result=[],cur='',inQ=false;
 for(var i=0;i<line.length;i++){
 var ch=line[i];
 if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
 else if(ch===delim&&!inQ){result.push(cur.trim());cur='';}
 else{cur+=ch;}
}
 result.push(cur.trim());
 return result;
}
 var headers=parseLine(lines[0]);
 var rows=[];
 for(var i=1;i<lines.length;i++){
 var vals=parseLine(lines[i]);
 var obj={};
 headers.forEach(function(h,idx){obj[h]=vals[idx]!==undefined?vals[idx]:'';});
 rows.push(obj);
}
 return rows;
}
function convert(){
 var v=document.getElementById('inp').value.trim();
 var delim=document.getElementById('delimSel').value;
 if(!v){setStatus('Input is empty','info');return;}
 try{
 if(_dir==='json2csv'){
 var json=JSON.parse(v);
 var csv=json2csv(json,delim);
 document.getElementById('out').textContent=csv;
 setStatus('Converted — '+(json.length)+' rows,'+csv.split('\n')[0].split(delim).length+' columns','valid');
}else{
 var rows=csv2json(v,delim);
 var out=JSON.stringify(rows,null,2);
 document.getElementById('out').textContent=out;
 setStatus('Converted — '+rows.length+' records','valid');
}
}catch(e){setStatus(e.message,'invalid');}
}
function clearAll(){document.getElementById('inp').value='';document.getElementById('out').textContent='';setStatus();}
function copyOut(){var t=document.getElementById('out').textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){toast('Copied!','ok');});}
function downloadOut(){var t=document.getElementById('out').textContent;if(!t)return;var ext=_dir==='json2csv'?'.csv':'.json';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='converted'+ext;a.click();toast('Downloaded!','ok');}
function loadFile(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){document.getElementById('inp').value=e.target.result;};r.readAsText(f);ev.target.value='';}
