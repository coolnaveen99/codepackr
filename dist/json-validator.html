 <div class="tool-page-header">

 <h1>JSON Validator</h1><p>Strictly validate JSON and pinpoint any errors.</p>
 </div>
 <div class="ws-toolbar">
 <div style="margin-left:auto"><button class="btn btn-accent" onclick="validate()">⚡ Validate</button></div>
 </div>
 <div id="statusEl" style="display:none" class="status-bar"></div>
 <div class="ws-panel" style="margin-bottom:16px">
 <div class="ws-panel-header"><span class="ws-panel-title">Input JSON</span><div class="ws-panel-actions"><button class="btn-icon" onclick="document.getElementById('inp').value=''">✕</button></div></div>
 <textarea class="ws-textarea" id="inp" oninput="validate()" placeholder="Paste JSON to validate…" spellcheck="false" style="min-height:400px"></textarea>
 </div>
 <script>function validate(){
 var v=document.getElementById('inp').value.trim();var s=document.getElementById('statusEl');
 if(!v){s.style.display='none';return;}
 try{JSON.parse(v);s.className='status-bar status-valid';s.textContent='✓ Valid JSON';s.style.display='flex';}
 catch(e){s.className='status-bar status-invalid';s.textContent='✗ '+e.message;s.style.display='flex';}
}</script>
