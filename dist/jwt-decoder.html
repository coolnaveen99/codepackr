<div style="background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;"><div style="max-width:1400px;margin:0 auto;padding:0 28px;display:flex;gap:4px;min-height:44px;align-items:center" id="toolNav"></div></div>
<div class="tool-page">
 <div class="tool-page-header">
 <div class="breadcrumb"><a href="index.html">Home</a> › JWT Decoder</div>
 <h1>JWT Decoder</h1><p>Decode and inspect JSON Web Tokens without verification.</p>
 </div>
 <div class="ws-toolbar">
 <div style="margin-left:auto"><button class="btn btn-secondary btn-sm" onclick="clearAll()">⟳ Clear</button></div>
 </div>
 <div class="ws-panel" style="margin-bottom:16px"><div class="ws-panel-header"><span class="ws-panel-title">JWT Token</span></div><textarea class="ws-textarea" id="inp" oninput="decode()" placeholder="Paste JWT token here…" spellcheck="false" style="min-height:100px;word-break:break-all"></textarea></div>
 <div id="statusEl" style="display:none" class="status-bar" style="margin-bottom:12px"></div>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px" id="parts"></div>
 <script>function b64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';try{return JSON.parse(atob(s));}catch(e){return atob(s);}}
 function decode(){
 var v=document.getElementById('inp').value.trim();
 var s=document.getElementById('statusEl');
 var p=document.getElementById('parts');
 if(!v){s.style.display='none';p.innerHTML='';return;}
 var parts=v.split('.');
 if(parts.length!==3){s.className='status-bar status-invalid';s.textContent='✗ Invalid JWT — must have 3 parts';s.style.display='flex';p.innerHTML='';return;}
 try{
 var header=b64url(parts[0]);var payload=b64url(parts[1]);
 s.className='status-bar status-valid';s.textContent='✓ Valid JWT structure';s.style.display='flex';
 var now=Math.floor(Date.now()/1000);var expInfo='';
 if(payload.exp){expInfo=payload.exp<now?'<div style=\"margin-top:8px;padding:6px 10px;background:rgba(255,101,132,0.1);border-radius:6px;color:var(--accent3);font-size:0.75rem\">⚠ Token expired</div>':'<div style=\"margin-top:8px;padding:6px 10px;background:rgba(0,229,195,0.1);border-radius:6px;color:var(--accent2);font-size:0.75rem\">✓ Not expired</div>';}
 function card(title,color,obj,extra){return'<div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden\"><div style=\"padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:'+color+'\">'+title+'</div><div style=\"padding:14px;font-family:var(--font-mono);font-size:0.78rem;line-height:1.8;white-space:pre-wrap;word-break:break-all\">'+JSON.stringify(obj,null,2)+(extra||'')+'</div></div>';}
 p.innerHTML=card('Header','var(--accent)',header)+card('Payload','var(--accent2)',payload,expInfo)+'<div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden\"><div style=\"padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#ffc84a\">Signature</div><div style=\"padding:14px;font-family:var(--font-mono);font-size:0.78rem;color:var(--text-muted);word-break:break-all\">'+parts[2]+'</div></div>';
}catch(e){s.className='status-bar status-invalid';s.textContent='✗ '+e.message;s.style.display='flex';}
}
 function clearAll(){document.getElementById('inp').value='';document.getElementById('statusEl').style.display='none';document.getElementById('parts').innerHTML='';}</script>
