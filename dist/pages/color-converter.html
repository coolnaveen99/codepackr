<body>

<div style="background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;"><div style="max-width:1400px;margin:0 auto;padding:0 28px;display:flex;gap:4px;min-height:44px;align-items:center" id="toolNav"></div></div>
<div class="tool-page">
 <div class="tool-page-header">
 <div class="breadcrumb"><a href="../index.html">Home</a> › Color Converter</div>
 <h1>Color Converter</h1><p>Convert between HEX, RGB, HSL, and CMYK color formats.</p>
 </div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
 <div class="ws-panel" style="padding:20px">
 <div style="margin-bottom:16px"><label style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);display:block;margin-bottom:8px">Pick Color</label><input type="color" id="picker" value="#6c63ff" oninput="fromPicker(this.value)" style="width:100%;height:48px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer"></div>
 <div style="margin-bottom:12px"><label style="font-size:0.75rem;color:var(--text-muted);display:block;margin-bottom:4px">HEX</label><input type="text" id="hexInp" value="#6C63FF" oninput="fromHex(this.value)" style="width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.88rem;padding:8px 12px;border-radius:var(--radius-sm);outline:none"></div>
 <div style="margin-bottom:12px"><label style="font-size:0.75rem;color:var(--text-muted);display:block;margin-bottom:4px">RGB</label><input type="text" id="rgbInp" oninput="fromRgb(this.value)" style="width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.88rem;padding:8px 12px;border-radius:var(--radius-sm);outline:none"></div>
 <div style="margin-bottom:12px"><label style="font-size:0.75rem;color:var(--text-muted);display:block;margin-bottom:4px">HSL</label><input type="text" id="hslInp" style="width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.88rem;padding:8px 12px;border-radius:var(--radius-sm);outline:none" readonly></div>
 </div>
 <div>
 <div id="swatch" style="height:200px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;background:#6c63ff"></div>
 <div style="display:grid;gap:8px" id="copyBtns"></div>
 </div>
 </div>
 <script>function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');var n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
 function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;var max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;if(max===min){h=s=0;}else{var d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
 function update(hex){var c=hexToRgb(hex);var hsl=rgbToHsl(c.r,c.g,c.b);var rgb='rgb('+c.r+','+c.g+','+c.b+')';var hslStr='hsl('+hsl.h+','+hsl.s+'%,'+hsl.l+'%)';document.getElementById('swatch').style.background=hex;document.getElementById('hexInp').value=hex.toUpperCase();document.getElementById('rgbInp').value=rgb;document.getElementById('hslInp').value=hslStr;document.getElementById('picker').value=hex;document.getElementById('copyBtns').innerHTML=[['HEX',hex.toUpperCase()],['RGB',rgb],['HSL',hslStr]].map(function(p){return'<button class="btn btn-secondary" style="justify-content:space-between;width:100%" onclick="navigator.clipboard.writeText(''+p[1]+'').then(function(){toast('Copied!','ok')})"><span style=\"font-size:0.72rem;color:var(--text-dim)\">'+p[0]+'</span><span style=\"font-family:var(--font-mono);font-size:0.82rem\">'+p[1]+'</span></button>';}).join('');}
 function fromPicker(v){update(v);}
 function fromHex(v){if(/^#?[0-9a-f]{6}$/i.test(v))update(v.startsWith('#')?v:'#'+v);}
 function fromRgb(v){var m=v.match(/rgb\(?(\d+),\s*(\d+),\s*(\d+)/i);if(m){var h=((1<<24)+(+m[1]<<16)+(+m[2]<<8)++m[3]).toString(16).slice(1);update('#'+h);}}
 update('#6c63ff');</script>
</div>
