 <button class="tab active" onclick="setDir('csv2xml',this)">CSV → XML</button>

 <select class="select" id="delimSel"><option value=",">Comma</option><option value=";">Semicolon</option><option value="|">Pipe</option><option value="&#9;">Tab</option></select>
 <input type="text" id="rootTag" value="records" placeholder="Root tag" style="width:100px;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.82rem;padding:7px 10px;border-radius:var(--radius-sm);outline:none">
 <input type="text" id="rowTag" value="record" placeholder="Row tag" style="width:100px;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.82rem;padding:7px 10px;border-radius:var(--radius-sm);outline:none">
 <div style="margin-left:auto;display:flex;gap:8px">
 <button class="btn btn-secondary btn-sm" onclick="clearAll()">⟳ Clear</button>
 <button class="btn btn-accent" onclick="convert()">⚡ Convert</button>
 </div>

<div class="toast" id="_toast"></div>
<script>function toast(msg,type){var el=document.getElementById('_toast');el.textContent=msg;el.className='toast'+(type?' t-'+type:'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2400);}
function setStatus(msg,type){var el=document.getElementById('statusEl');if(!msg){el.style.display='none';return;}el.className='status-bar status-'+type;el.textContent=(type==='valid'?'✓ ':type==='invalid'?'✗ ':'ℹ ')+msg;el.style.display='flex';}
var _dir='csv2xml';
function setDir(d,btn){_dir=d;document.querySelectorAll('#dirTab .tab').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');document.getElementById('inLabel').textContent=d==='csv2xml'?'CSV Input':'XML Input';document.getElementById('outLabel').textContent=d==='csv2xml'?'XML Output':'CSV Output';document.getElementById('inp').placeholder=d==='csv2xml'?'Paste CSV data…':'Paste XML data…';document.getElementById('out').textContent='';setStatus();}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeTag(s){return s.replace(/[^a-zA-Z0-9_\-\.]/g,'_').replace(/^[^a-zA-Z_]/,'_$&');}
function parseCsvLine(line,delim){
 var result=[],cur='',inQ=false;
 for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(ch===delim&&!inQ){result.push(cur);cur='';}else cur+=ch;}
 result.push(cur);return result;
}
function csv2xml(text,delim){
 var rootTag=document.getElementById('rootTag').value||'records';
 var rowTag=document.getElementById('rowTag').value||'record';
 var lines=text.split('\n').filter(function(l){return l.trim();});
 if(lines.length<2)throw new Error('Need at least header+1 data row');
 var headers=parseCsvLine(lines[0],delim).map(function(h){return safeTag(h.trim());});
 var xml='<?xml version="1.0" encoding="UTF-8"?>\n<'+rootTag+'>\n';
 for(var i=1;i<lines.length;i++){
 var vals=parseCsvLine(lines[i],delim);
 xml+='<'+rowTag+'>\n';
 headers.forEach(function(h,idx){xml+='<'+h+'>'+escXml(vals[idx]||'')+'</'+h+'>\n';});
 xml+='</'+rowTag+'>\n';
}
 xml+='</'+rootTag+'>';
 return xml;
}
function xml2csv(text,delim){
 var parser=new DOMParser();
 var doc=parser.parseFromString(text,'application/xml');
 var err=doc.querySelector('parsererror');
 if(err)throw new Error('Invalid XML:'+err.textContent.split('\n')[0]);
 var root=doc.documentElement;
 var rows=Array.from(root.children);
 if(!rows.length)throw new Error('No child elements found in XML root');
 var headers=[];
 rows.forEach(function(row){Array.from(row.children).forEach(function(child){if(headers.indexOf(child.tagName)<0)headers.push(child.tagName);});});
 var lines=[headers.join(delim)];
 rows.forEach(function(row){
 var vals=headers.map(function(h){var el=row.querySelector(h);return el?el.textContent:'';});
 lines.push(vals.map(function(v){return v.includes(delim)||v.includes('\n')?'"'+v.replace(/"/g,'""')+'"':v;}).join(delim));
});
 return lines.join('\n');
}
function convert(){
 var v=document.getElementById('inp').value.trim();
 var delim=document.getElementById('delimSel').value;
 if(!v){setStatus('Input is empty','info');return;}
 try{
 if(_dir==='csv2xml'){var r=csv2xml(v,delim);document.getElementById('out').textContent=r;setStatus('Converted to XML — '+r.split('\n').length+' lines','valid');}
 else{var r2=xml2csv(v,delim);document.getElementById('out').textContent=r2;setStatus('Converted to CSV — '+(r2.split('\n').length-1)+' rows','valid');}
}catch(e){setStatus(e.message,'invalid');}
}
function clearAll(){document.getElementById('inp').value='';document.getElementById('out').textContent='';setStatus();}
function copyOut(){var t=document.getElementById('out').textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){toast('Copied!','ok');});}
function downloadOut(){var t=document.getElementById('out').textContent;if(!t)return;var ext=_dir==='csv2xml'?'.xml':'.csv';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='converted'+ext;a.click();toast('Downloaded!','ok');}
function loadFile(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){document.getElementById('inp').value=e.target.result;};r.readAsText(f);ev.target.value='';}
