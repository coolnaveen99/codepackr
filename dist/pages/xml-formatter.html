<body>
<header class="site-header"><div class="header-inner">
 <a href="../index.html" class="logo"><div class="logo-mark">{ }</div>Code<span>packr</span></a>
 <nav class="main-nav"><a href="../index.html#formatters">Formatters</a><a href="../index.html#encoders">Encoders</a><a href="../index.html#validators">Validators</a><a href="../index.html#utils">Utilities</a></nav>
</div></header>
<div style="background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;"><div style="max-width:1400px;margin:0 auto;padding:0 28px;display:flex;gap:4px;min-height:44px;align-items:center" id="toolNav"></div></div>
<div class="tool-page">
 <div class="tool-page-header">
 <div class="breadcrumb"><a href="../index.html">Home</a> › XML Formatter</div>
 <h1>XML Formatter</h1><p>Indent and prettify XML documents.</p>
 </div>
 <div class="ws-toolbar">
 <div class="tabs"><button class="tab active" onclick="doFmt('pretty',this)">Beautify</button><button class="tab" onclick="doFmt('mini',this)">Minify</button></div>
 <div style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-secondary btn-sm" onclick="clearAll()">⟳ Clear</button><button class="btn btn-accent" onclick="doFmt('pretty',null)">⚡ Format</button></div>
 </div>
 <div id="statusEl" style="display:none" class="status-bar"></div>
 <div class="tool-workspace">
 <div class="ws-panel"><div class="ws-panel-header"><span class="ws-panel-title">Input XML</span></div><textarea class="ws-textarea" id="inp" placeholder="Paste XML here…" spellcheck="false" style="min-height:320px"></textarea></div>
 <div class="ws-panel"><div class="ws-panel-header"><span class="ws-panel-title">Output</span><div class="ws-panel-actions"><button class="btn-icon" onclick="navigator.clipboard.writeText(document.getElementById('out').textContent).then(function(){toast('Copied!','ok')})">⧉</button></div></div><div class="output-content" id="out" style="min-height:320px;white-space:pre-wrap"></div></div>
 </div>
 <script>function doFmt(mode){
 var v=document.getElementById('inp').value.trim();if(!v)return;
 var p=new DOMParser();var d=p.parseFromString(v,'application/xml');var err=d.querySelector('parsererror');
 var s=document.getElementById('statusEl');
 if(err){s.className='status-bar status-invalid';s.textContent='✗ '+err.textContent.split('\n')[0];s.style.display='flex';return;}
 s.className='status-bar status-valid';s.textContent='✓ Valid XML';s.style.display='flex';
 if(mode==='mini'){var xs=new XMLSerializer();document.getElementById('out').textContent=xs.serializeToString(d).replace(/\s+/g,' ');return;}
 function fmt(node,d){var ind=' '.repeat(d);if(node.nodeType===3){var t=node.textContent.trim();return t?ind+t+'\n':'';}if(node.nodeType!==1)return'';var tag=node.tagName;var attrs=Array.from(node.attributes).map(function(a){return' '+a.name+'="'+a.value+'"';}).join('');var ch=Array.from(node.childNodes).map(function(c){return fmt(c,d+1);}).join('');if(!ch.trim())return ind+'<'+tag+attrs+'/>\n';return ind+'<'+tag+attrs+'>\n'+ch+ind+'</'+tag+'>\n';}
 document.getElementById('out').textContent=fmt(d.documentElement,0);
}
 function clearAll(){document.getElementById('inp').value='';document.getElementById('out').textContent='';document.getElementById('statusEl').style.display='none';}</script>
</div>

<script>function toast(m,t){var el=document.getElementById('_toast');el.textContent=m;el.className='toast'+(t?' t-'+t:'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2400);}
