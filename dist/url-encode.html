<body>
<header class="site-header"><div class="header-inner">
 <a href="index.html" class="logo"><div class="logo-mark">{ }</div>Code<span>packr</span></a>
 <nav class="main-nav"><a href="index.html#formatters">Formatters</a><a href="index.html#encoders">Encoders</a><a href="index.html#validators">Validators</a><a href="index.html#utils">Utilities</a></nav>
</div></header>
<div style="background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;"><div style="max-width:1400px;margin:0 auto;padding:0 28px;display:flex;gap:4px;min-height:44px;align-items:center" id="toolNav"></div></div>
<div class="tool-page">
 <div class="tool-page-header">
 <div class="breadcrumb"><a href="index.html">Home</a> › URL Encoder / Decoder</div>
 <h1>URL Encoder / Decoder</h1><p>Encode and decode URL components and full URLs.</p>
 </div>
 <div class="ws-toolbar">
 <div class="tabs" id="modeTab">
 <button class="tab active" onclick="setMode('enc',this)">Encode</button>
 <button class="tab" onclick="setMode('dec',this)">Decode</button>
 </div>
 <div class="tabs">
 <button class="tab active" id="compBtn" onclick="toggleComp(this)">Component</button>
 </div>
 <div style="margin-left:auto"><button class="btn btn-accent" onclick="run()">⚡ Convert</button></div>
 </div>
 <div class="tool-workspace">
 <div class="ws-panel"><div class="ws-panel-header"><span class="ws-panel-title" id="inLbl">Input</span></div><textarea class="ws-textarea" id="inp" placeholder="Enter URL or text…" spellcheck="false"></textarea></div>
 <div class="ws-panel"><div class="ws-panel-header"><span class="ws-panel-title">Output</span><div class="ws-panel-actions"><button class="btn-icon" onclick="navigator.clipboard.writeText(document.getElementById('out').textContent).then(function(){toast('Copied!','ok');})">⧉</button></div></div><div class="output-content" id="out" style="min-height:320px;word-break:break-all"></div></div>
 </div>
 <script>var _m='enc',_comp=true;
 function setMode(m,btn){_m=m;document.querySelectorAll('#modeTab .tab').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');}
 function toggleComp(btn){_comp=!_comp;btn.classList.toggle('active',_comp);}
 function run(){var v=document.getElementById('inp').value;if(!v)return;try{var r=_m==='enc'?(_comp?encodeURIComponent(v):encodeURI(v)):(_comp?decodeURIComponent(v):decodeURI(v));document.getElementById('out').textContent=r;}catch(e){document.getElementById('out').textContent='Error:'+e.message;}}</script>
</div>
<footer class="site-footer" style="margin-top:48px"><div class="footer-bottom" style="max-width:1400px;margin:0 auto;border-top:none;padding:20px 28px"><div>© 2025 <span style="color:var(--accent2)">Codepackr</span></div><a href="index.html" style="color:var(--accent)">← All Tools</a></div></footer>
<div class="toast" id="_toast"></div>
<script>function toast(m,t){var el=document.getElementById('_toast');el.textContent=m;el.className='toast'+(t?' t-'+t:'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2400);}

</body></html>
