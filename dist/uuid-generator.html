<body>
<header class="site-header"><div class="header-inner">
 <a href="index.html" class="logo"><div class="logo-mark">{ }</div>Code<span>packr</span></a>
 <nav class="main-nav"><a href="index.html#formatters">Formatters</a><a href="index.html#encoders">Encoders</a><a href="index.html#validators">Validators</a><a href="index.html#utils">Utilities</a></nav>
</div></header>
<div style="background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;">
 <div style="max-width:1400px;margin:0 auto;padding:0 28px;display:flex;gap:4px;min-height:44px;align-items:center" id="toolNav"></div>
</div>
<div class="tool-page">
 <div class="tool-page-header">
 <div class="breadcrumb"><a href="index.html">Home</a> › UUID Generator</div>
 <h1>UUID Generator</h1><p>Generate RFC 4122 compliant v4 (random) UUIDs in bulk.</p>
 </div>
 <div class="ws-toolbar">
 <label style="font-size:0.83rem;color:var(--text-muted)">Count:</label>
 <input type="number" id="countInp" value="5" min="1" max="100" style="width:70px;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:0.85rem;padding:7px 10px;border-radius:var(--radius-sm);outline:none">
 <div class="tabs">
 <button class="tab active" id="upperBtn" onclick="toggleCase(this)">Uppercase</button>
 <button class="tab active" id="hyphBtn" onclick="toggleHyph(this)">Hyphens</button>
 </div>
 <div style="margin-left:auto;display:flex;gap:8px">
 <button class="btn btn-secondary btn-sm" onclick="copyAll()">⧉ Copy All</button>
 <button class="btn btn-secondary btn-sm" onclick="downloadAll()">↓ Download</button>
 <button class="btn btn-accent" onclick="generate()">⚡ Generate</button>
 </div>
 </div>
 <div class="output-area">
 <div class="output-header">
 <span style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:0.04em">Generated UUIDs</span>
 <span id="countLabel" style="font-size:0.78rem;color:var(--text-muted)"></span>
 </div>
 <div id="out" style="padding:16px;font-family:var(--font-mono);font-size:0.85rem;line-height:2.2;min-height:240px">
 <div style="color:var(--text-dim);text-align:center;padding:40px 20px">Click <strong style="color:var(--text)">⚡ Generate</strong> to create UUIDs</div>
 </div>
 </div>
</div>
<footer class="site-footer" style="margin-top:48px"><div class="footer-bottom" style="max-width:1400px;margin:0 auto;border-top:none;padding:20px 28px"><div>© 2025 <span style="color:var(--accent2)">Codepackr</span></div><a href="index.html" style="color:var(--accent)">← All Tools</a></div></footer>
<div class="toast" id="_toast"></div>
<script>function toast(msg,type){var el=document.getElementById('_toast');el.textContent=msg;el.className='toast'+(type?' t-'+type:'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2400);}
var _upper=true,_hyph=true;
function toggleCase(btn){_upper=!_upper;btn.classList.toggle('active',_upper);generate();}
function toggleHyph(btn){_hyph=!_hyph;btn.classList.toggle('active',_hyph);generate();}
function uuidv4(){
 return'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,function(c){
 var r=crypto.getRandomValues(new Uint8Array(1))[0];
 return(c^(r&(15>>(c/4)))).toString(16);
});
}
function fmtUUID(id){var o=_upper?id.toUpperCase():id.toLowerCase();return _hyph?o:o.replace(/-/g,'');}
function generate(){
 var n=Math.min(parseInt(document.getElementById('countInp').value)||1,100);
 document.getElementById('countLabel').textContent=n+' UUID'+(n!==1?'s':'');
 var rows='';
 for(var i=0;i<n;i++){
 var id=fmtUUID(uuidv4());
 rows+='<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)" data-uuid="'+id+'"><span style="color:var(--text)">'+id+'</span><button class="btn-icon" onclick="copySingle(this)" title="Copy">⧉</button></div>';
}
 document.getElementById('out').innerHTML=rows;
}
function copySingle(btn){
 var id=btn.parentElement.getAttribute('data-uuid');
 navigator.clipboard.writeText(id).then(function(){toast('Copied!','ok');});
}
function copyAll(){
 var items=document.getElementById('out').querySelectorAll('[data-uuid]');
 if(!items.length){toast('Generate UUIDs first','');return;}
 var text=Array.from(items).map(function(el){return el.getAttribute('data-uuid');}).join('\n');
 navigator.clipboard.writeText(text).then(function(){toast('All copied!','ok');});
}
function downloadAll(){
 var items=document.getElementById('out').querySelectorAll('[data-uuid]');
 if(!items.length){toast('Generate UUIDs first','');return;}
 var text=Array.from(items).map(function(el){return el.getAttribute('data-uuid');}).join('\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='uuids.txt';a.click();toast('Downloaded!','ok');
}
(function(){var tools=[{h:'json-formatter.html',l:'JSON'},{h:'diff-checker.html',l:'Diff'},{h:'html-formatter.html',l:'HTML'},{h:'css-formatter.html',l:'CSS'},{h:'base64.html',l:'Base64'},{h:'url-encode.html',l:'URL'},{h:'regex-tester.html',l:'Regex'},{h:'hash-generator.html',l:'Hash'},{h:'uuid-generator.html',l:'UUID'},{h:'lorem-ipsum.html',l:'Lorem'}];document.getElementById('toolNav').innerHTML=tools.map(function(t){return'<a href="'+t.h+'" class="tab'+(t.h==='uuid-generator.html'?' active':'')+'" style="text-decoration:none">'+t.l+'</a>';}).join('');})();</script>
